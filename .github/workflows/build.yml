name: Build and validate MossUnreal

on:
  push:
    branches: [main, master]
    paths:
      - "MossUnreal.uplugin"
      - "Source/**"
      - "Examples/**"
      - "Docs/**"
      - "Scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "MossUnreal.uplugin"
      - "Source/**"
      - "Examples/**"
      - "Docs/**"
      - "Scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mossunreal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin metadata and package source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate plugin and source contract
        run: python3 Scripts/validate_plugin.py

      - name: Create source package
        run: |
          mkdir -p artifacts/MossUnreal
          cp MossUnreal.uplugin README.md LICENSE artifacts/MossUnreal/
          cp -R Source Docs Examples Scripts artifacts/MossUnreal/

      - name: Upload validated source package
        uses: actions/upload-artifact@v6
        with:
          name: MossUnreal-source-${{ github.sha }}
          path: artifacts/MossUnreal/
          if-no-files-found: error
          retention-days: 14

  unreal-build:
    name: Compile plugin with Unreal Engine
    # Configure a self-hosted Windows runner with Unreal Engine installed.
    # Set repository variable ENABLE_UNREAL_BUILD to "true" to enable this job.
    if: ${{ vars.ENABLE_UNREAL_BUILD == 'true' }}
    runs-on: [self-hosted, Windows, UnrealEngine]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Unreal installation
        shell: pwsh
        run: |
          if (-not $env:UNREAL_ENGINE_ROOT) {
            throw "Set UNREAL_ENGINE_ROOT on the self-hosted runner."
          }
          $uat = Join-Path $env:UNREAL_ENGINE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          if (-not (Test-Path $uat)) {
            throw "RunUAT.bat not found at $uat"
          }

      - name: Build plugin
        shell: pwsh
        run: |
          $uat = Join-Path $env:UNREAL_ENGINE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          $plugin = (Resolve-Path "MossUnreal.uplugin").Path
          $output = Join-Path $PWD "artifacts/MossUnreal"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $uat BuildPlugin "-Plugin=$plugin" "-Package=$output" "-TargetPlatforms=Win64"
          if ($LASTEXITCODE -ne 0) { throw "Unreal BuildPlugin failed." }

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v6
        with:
          name: MossUnreal-Win64-${{ github.sha }}
          path: artifacts/MossUnreal/
          if-no-files-found: error
          retention-days: 14
