name: Release MossUnreal

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build and publish Unreal plugin
    runs-on: [self-hosted, Windows, UnrealEngine]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate version and Unreal installation
        shell: pwsh
        run: |
          if (-not $env:UNREAL_ENGINE_ROOT) {
            throw "Set UNREAL_ENGINE_ROOT on the self-hosted runner."
          }
          $uat = Join-Path $env:UNREAL_ENGINE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          if (-not (Test-Path $uat)) { throw "RunUAT.bat not found: $uat" }

      - name: Build distributable plugin
        shell: pwsh
        run: |
          $uat = Join-Path $env:UNREAL_ENGINE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          $plugin = (Resolve-Path "MossUnreal.uplugin").Path
          $package = Join-Path $PWD "release/MossUnreal"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          & $uat BuildPlugin "-Plugin=$plugin" "-Package=$package" "-TargetPlatforms=Win64"
          if ($LASTEXITCODE -ne 0) { throw "Unreal BuildPlugin failed; release cancelled." }

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "MossUnreal-${{ inputs.tag || github.ref_name }}-Win64.zip"
          Compress-Archive -Path "release/MossUnreal/*" -DestinationPath $archive -Force
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MossUnreal ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ARCHIVE }}
          fail_on_unmatched_files: true
